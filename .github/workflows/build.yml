name: build
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          SHA=$(grep -oP '^ARG COMFY_SHA=\K[0-9a-f]+' Dockerfile | cut -c1-7)
          set +e
          docker build --progress=plain -t "$IMG:latest" -t "$IMG:comfy-$SHA" . > build.log 2>&1
          rc=$?
          set -e
          # สรุปผลเป็นหมายเหตุของงาน (อ่านได้จากภายนอกโดยไม่ต้องเปิดบันทึกเต็ม)
          grep -E "torch==|torch [0-9]|cuda" build.log | tail -6 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=torch::/'
          if [ $rc -ne 0 ]; then echo "::error title=build failed::$(tail -40 build.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; fi
          docker push "$IMG:latest"
          docker push "$IMG:comfy-$SHA"
          docker image inspect "$IMG:latest" --format '{{.Size}}' | awk '{printf "image size %.1f GB\n", $1/1e9}'
